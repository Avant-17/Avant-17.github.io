<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f6ef7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="记账本">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>日历记账本</title>
<style>
  :root{
    --primary:#4f6ef7; --primary-dark:#3b57d6;
    --income:#1a9e5c; --expense:#e0554d;
    --bg:#f3f5fa; --card:#fff; --border:#e4e8f0; --text:#2b3245; --muted:#8a92a6;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);
       padding:12px 12px calc(12px + var(--safe-b) + 70px);max-width:640px;margin:0 auto;
       overscroll-behavior-y:contain}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  h1{font-size:19px}
  .icon-btn{width:38px;height:38px;border:none;border-radius:10px;background:var(--card);
       border:1px solid var(--border);font-size:17px;cursor:pointer;color:var(--text);flex-shrink:0}
  .period-row{display:flex;align-items:center;gap:6px;margin-bottom:10px}
  .period-row .nav{width:40px;height:40px;border:1px solid var(--border);background:var(--card);
       border-radius:10px;font-size:18px;color:var(--text);cursor:pointer;flex-shrink:0}
  #periodLabel{font-size:16px;font-weight:700;flex:1;text-align:center}
  .seg{display:flex;background:#eef1f6;border-radius:10px;padding:3px;gap:3px}
  .seg button{flex:1;border:none;background:transparent;border-radius:8px;padding:8px 0;
       font-size:14px;color:var(--muted);cursor:pointer}
  .seg button.on{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  .seg.small button{padding:6px 0;font-size:12px}

  .summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
  .card .label{font-size:11px;color:var(--muted)}
  .card .value{font-size:17px;font-weight:700;margin-top:3px;word-break:break-all}
  .value.income{color:var(--income)} .value.expense{color:var(--expense)} .value.balance{color:var(--primary)}
  .card.click{cursor:pointer}
  .card.click:active{background:#eef1fe}

  .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .dow{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
  .day{background:var(--card);border:1px solid var(--border);border-radius:9px;aspect-ratio:1/1.12;
       padding:4px 5px;cursor:pointer;position:relative;overflow:hidden;
       display:flex;flex-direction:column;transition:.12s}
  .day:active{background:#eef1fe}
  .day.sel{border-color:var(--primary);background:#eef1fe}
  .day.empty{background:transparent;border:none;cursor:default}
  .day.today .dnum{color:var(--primary)}
  .day .dnum{font-size:12px;font-weight:600;align-self:flex-end}
  .day .tag{font-size:10px;line-height:1.4;margin-top:1px;font-weight:600;word-break:break-all}
  .tag .in{color:var(--income)} .tag .out{color:var(--expense)}
  .day .dot{width:5px;height:5px;border-radius:50%;background:var(--primary);margin:auto auto 1px}

  /* 年视图 */
  .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mcell{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;
       cursor:pointer;min-height:84px}
  .mcell:active{background:#eef1fe}
  .mcell .m{font-size:15px;font-weight:700}
  .mcell .mi{font-size:11px;color:var(--income);margin-top:5px;font-weight:600}
  .mcell .mo{font-size:11px;color:var(--expense);margin-top:2px;font-weight:600}
  .mcell .none{color:var(--muted);font-size:11px;margin-top:5px}

  /* 全部视图 */
  .totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .totals .t{background:var(--card);border:1px solid var(--border);border-radius:12px;
       padding:12px 6px;text-align:center}
  .totals .l{font-size:11px;color:var(--muted)}
  .totals .v{font-size:15px;font-weight:700;margin-top:4px;word-break:break-all}
  .empty-tip{font-size:12px;color:var(--muted);padding:4px 0}

  /* 分类统计 */
  .cats-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:10px}
  .cats-card h4{font-size:13px;margin-bottom:8px;color:var(--muted)}
  .catrow{margin-bottom:9px}
  .catrow .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
  .bar{height:6px;background:#eef1f6;border-radius:3px;margin-top:4px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px}
  .bar i.income{background:var(--income)} .bar i.expense{background:var(--expense)}

  /* 当日明细面板 */
  #dayPanel{background:var(--card);border:1px solid var(--border);border-radius:12px;
       padding:12px;margin-top:10px}
  #dayPanel .phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  #dayPanel .phead b{font-size:15px}
  #dayPanel .psum{font-size:12px;color:var(--muted)}
  .rec{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;
       border-bottom:1px solid #f0f2f7;font-size:13px}
  .rec:last-child{border-bottom:none}
  .rec .top{display:flex;justify-content:space-between;gap:6px}
  .rec .meta{color:var(--muted);font-size:11px;margin-top:2px}
  .rec .ops{display:flex;gap:2px;flex-shrink:0}
  .rec .ops button{border:none;background:none;font-size:15px;cursor:pointer;padding:4px 6px}

  dialog{border:none;border-radius:16px;padding:18px;width:min(520px,94vw);max-height:88vh;
       box-shadow:0 10px 40px rgba(0,0,0,.25)}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  dialog h3{margin-bottom:12px;font-size:16px}
  .form-row{margin-bottom:11px}
  .form-row>label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .form-row input,.form-row select{width:100%;padding:10px;border:1px solid var(--border);
       border-radius:10px;font-size:16px;background:#fff;color:var(--text)}
  .hint{font-size:11px;color:var(--muted);margin-top:5px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--border);background:#fff;border-radius:20px;padding:6px 13px;
       font-size:13px;color:var(--text);cursor:pointer}
  .chip.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
  .actions{display:flex;gap:8px;margin-top:12px}
  .btn{flex:1;padding:12px;border:1px solid var(--border);background:#fff;border-radius:12px;
       font-size:15px;color:var(--text);cursor:pointer}
  .btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}
  .btn.primary:active{background:var(--primary-dark)}

  /* 图表 */
  .chart-sec{font-size:12px;color:var(--muted);margin:12px 0 6px;font-weight:600}
  canvas.chart{width:100%;height:170px;display:block}
  .lg-row{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 0}
  .lg-row i{width:10px;height:10px;border-radius:3px;flex-shrink:0}
  .lg-row span{flex:1}
  #pieLegend{max-height:150px;overflow:auto;margin-top:6px}

  /* 悬浮记账按钮 */
  .fab{position:fixed;right:18px;bottom:calc(18px + var(--safe-b));width:58px;height:58px;
       border-radius:50%;background:var(--primary);color:#fff;font-size:28px;line-height:1;
       border:none;box-shadow:0 4px 16px rgba(79,110,247,.5);cursor:pointer;z-index:50}
  .fab:active{background:var(--primary-dark)}
</style>
</head>
<body>
  <header>
    <h1>📅 日历记账本</h1>
    <div style="display:flex;gap:6px">
      <button class="icon-btn" onclick="pickDataFile()" title="选择数据自动保存位置">📁</button>
      <button class="icon-btn" onclick="backup()" title="导出备份">💾</button>
      <button class="icon-btn" onclick="openSettings()" title="薪资设置">⚙️</button>
      <button class="icon-btn" id="installBtn" style="display:none" title="安装应用">⬇️</button>
    </div>
  </header>

  <!-- 视图切换 -->
  <div class="form-row" style="margin-bottom:8px">
    <div class="seg" id="viewSeg">
      <button type="button" data-v="month" class="on">月视图</button>
      <button type="button" data-v="year">年视图</button>
      <button type="button" data-v="all">全部</button>
    </div>
  </div>
  <div class="period-row">
    <button class="nav" id="prevBtn" onclick="changePeriod(-1)">‹</button>
    <span id="periodLabel"></span>
    <button class="nav" id="nextBtn" onclick="changePeriod(1)">›</button>
  </div>

  <!-- 汇总：点击收入/支出打开图表分析 -->
  <div class="summary">
    <div class="card click" onclick="openStats('income')" title="点击查看趋势与占比"><div class="label" id="incLabel">当月收入</div><div class="value income" id="sumIncome">¥0.00</div></div>
    <div class="card click" onclick="openStats('expense')" title="点击查看趋势与占比"><div class="label" id="expLabel">当月支出</div><div class="value expense" id="sumExpense">¥0.00</div></div>
    <div class="card"><div class="label" id="balLabel">当月结余</div><div class="value balance" id="sumBalance">¥0.00</div></div>
    <div class="card"><div class="label">记账天数</div><div class="value" id="sumDays">0 天</div></div>
  </div>

  <div id="calendarArea"></div>
  <div id="dayPanel" style="display:none"></div>
  <div class="cats-card" id="catsCard" style="display:none"></div>

  <button class="fab" onclick="openForm()">＋</button>

  <!-- 记账弹窗 -->
  <dialog id="entryDialog">
    <h3 id="entryTitle">记一笔</h3>
    <div class="form-row">
      <div class="seg" id="etypeSeg">
        <button type="button" data-v="expense">🛒 支出</button>
        <button type="button" data-v="income">💰 收入</button>
      </div>
    </div>
    <div class="form-row" id="emodeRow">
      <div class="seg small" id="emodeSeg">
        <button type="button" data-v="fixed">固定金额</button>
        <button type="button" data-v="hours">按小时</button>
        <button type="button" data-v="days">按天</button>
      </div>
    </div>
    <div class="form-row">
      <label>分类（必选）</label>
      <div class="chips" id="ecatChips"></div>
    </div>
    <div class="form-row">
      <label>账户（必选）</label>
      <select id="eaccount"></select>
    </div>
    <div class="form-row">
      <label>日期（必选）</label>
      <input type="date" id="edate">
    </div>
    <div class="form-row" id="hoursRow" style="display:none">
      <label>工作时长（小时）</label>
      <input type="text" id="ehoursInput" autocomplete="off" placeholder="例如 8 或 2+4.5">
      <div class="hint">时薪 <span id="hourlyRateHint"></span> · 支持加减乘除算式</div>
      <div class="hint calcPrev" id="ehoursPrev"></div>
    </div>
    <div class="form-row" id="daysRow" style="display:none">
      <label>工作天数（0.5 = 半天）</label>
      <input type="text" id="edaysInput" autocomplete="off" value="1">
      <div class="hint">日薪 <span id="dailyRateHint"></span> · 支持加减乘除算式</div>
      <div class="hint calcPrev" id="edaysPrev"></div>
    </div>
    <div class="form-row" id="amountRow">
      <label>金额（元）</label>
      <input type="text" id="eamountInput" autocomplete="off" placeholder="例如 25.5 或 12+8*2">
      <div class="hint calcPrev" id="eamountPrev"></div>
    </div>
    <div class="form-row" id="amtResultRow" style="display:none">
      <div class="hint" id="amtResult" style="font-size:13px;color:var(--primary);font-weight:600"></div>
    </div>
    <div class="form-row">
      <label>备注（可选）</label>
      <input type="text" id="enote" placeholder="例如：午餐 / 加班">
    </div>
    <div class="actions">
      <button class="btn" onclick="entryDialog.close()">取消</button>
      <button class="btn primary" id="entrySaveBtn" onclick="saveForm()">保存</button>
    </div>
  </dialog>

  <!-- 图表分析弹窗 -->
  <dialog id="statsDialog">
    <h3 id="statsTitle"></h3>
    <div class="seg small" id="statsTypeSeg">
      <button type="button" data-v="income">💰 收入</button>
      <button type="button" data-v="expense">🛒 支出</button>
    </div>
    <div class="chart-sec" id="trendTitle">📈 趋势</div>
    <canvas id="lineCv" class="chart"></canvas>
    <div class="chart-sec">🥧 分类占比</div>
    <canvas id="pieCv" class="chart"></canvas>
    <div id="pieLegend"></div>
    <div class="actions">
      <button class="btn" onclick="statsDialog.close()">关闭</button>
    </div>
  </dialog>

  <!-- 薪资设置弹窗 -->
  <dialog id="settingsDialog">
    <h3>⚙️ 薪资设置</h3>
    <div class="form-row">
      <label>时薪（元/小时）</label>
      <input type="number" id="setHourly" step="0.01" min="0" inputmode="decimal" placeholder="例如 50">
    </div>
    <div class="form-row">
      <label>日薪（元/天）</label>
      <input type="number" id="setDaily" step="0.01" min="0" inputmode="decimal" placeholder="例如 400">
      <div class="hint">收入选择"按小时/按天"计费时使用；修改后已有记录金额不变，新记录按新标准计算。</div>
    </div>
    <div class="actions">
      <button class="btn" onclick="settingsDialog.close()">取消</button>
      <button class="btn primary" onclick="saveSettings()">保存</button>
    </div>
  </dialog>

<script>
const LS_DATA='calFin.entries', LS_SETTINGS='calFin.settings';
let entries = JSON.parse(localStorage.getItem(LS_DATA)||'{}');
let settings = JSON.parse(localStorage.getItem(LS_SETTINGS)||'{"hourly":0,"daily":0}');
let view = new Date(); view.setDate(1);
let curPeriod='month';                 // month | year | all
let selectedDay=null;                  // 当日明细面板选中的日期
let statsType='income';                // 图表弹窗当前类型

/* 分类 / 账户 */
const CATS={
  expense:['餐饮','交通','购物','住房','娱乐','医疗','教育','人情','洗澡','饮水','日用','其他'],
  income:['工资','奖金','兼职','投资','其他']
};
const ACCOUNTS=['现金','微信','支付宝','易校园','银行卡','其他'];
const PALETTE=['#4f6ef7','#1a9e5c','#e0554d','#f5a623','#9b59b6','#16a085','#e67e22','#34495e','#e84393','#00b894','#6c5ce7','#fd79a8'];

const fmt = n => '¥' + (n||0).toFixed(2);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const save = () => { localStorage.setItem(LS_DATA, JSON.stringify(entries)); autoSaveFile(); };
const $ = id => document.getElementById(id);
const entryDialog=$('entryDialog'), settingsDialog=$('settingsDialog'), statsDialog=$('statsDialog');

function entryAmount(e){
  if(e.type==='income'){
    if(e.mode==='hours') return (e.hours||0)*(e.rate||settings.hourly||0);
    if(e.mode==='days') return (e.days||0)*(e.rate||settings.daily||0);
    return e.amount||0;
  }
  return e.amount||0;
}
function tagNum(n){
  if(n>=10000) return +(n/10000).toFixed(2)+'w';
  return +n.toFixed(2);
}
function modeDesc(e){
  if(e.type!=='income') return '';
  if(e.mode==='hours') return `${e.hours}小时×${fmt(e.rate||settings.hourly)}`;
  if(e.mode==='days') return `${e.days}天×${fmt(e.rate||settings.daily)}`;
  return '';
}

/* ===== 周期与汇总 ===== */
function periodPrefix(){
  if(curPeriod==='month') return ymd(view).slice(0,7);
  if(curPeriod==='year')  return view.getFullYear()+'-';
  return '';
}
function periodName(){
  if(curPeriod==='month') return `${view.getFullYear()}年${view.getMonth()+1}月`;
  if(curPeriod==='year')  return `${view.getFullYear()}年`;
  return '全部';
}
function scopeText(){ return curPeriod==='month'?'当月':curPeriod==='year'?'本年':'累计'; }
function collect(pre){
  let inc=0,exp=0,days=0;
  const catInc={},catExp={};
  Object.keys(entries).sort().forEach(k=>{
    if(pre && !k.startsWith(pre)) return;
    if(!entries[k].length) return;
    days++;
    entries[k].forEach(e=>{
      const a=entryAmount(e), c=e.cat||'其他';
      if(e.type==='income'){ inc+=a; catInc[c]=(catInc[c]||0)+a; }
      else{ exp+=a; catExp[c]=(catExp[c]||0)+a; }
    });
  });
  return {inc,exp,days,catInc,catExp};
}

/* ===== 主界面渲染 ===== */
function render(){
  $('periodLabel').textContent=periodName();
  const scope=scopeText();
  $('incLabel').textContent=scope+'收入';
  $('expLabel').textContent=scope+'支出';
  $('balLabel').textContent=scope+'结余';
  $('prevBtn').style.display=curPeriod==='all'?'none':'';
  $('nextBtn').style.display=curPeriod==='all'?'none':'';

  const data=collect(periodPrefix());
  $('sumIncome').textContent=fmt(data.inc);
  $('sumExpense').textContent=fmt(data.exp);
  $('sumBalance').textContent=fmt(data.inc-data.exp);
  $('sumDays').textContent=data.days+' 天';

  const area=$('calendarArea');
  if(curPeriod==='month') area.innerHTML=renderMonth();
  else if(curPeriod==='year') area.innerHTML=renderYear();
  else area.innerHTML=renderAll();

  if(curPeriod!=='month') hideDayPanel();
  $('catsCard').style.display='';
  $('catsCard').innerHTML=`
    <h4>📊 ${scope}分类统计（按金额从高到低）</h4>
    <div class="chart-sec" style="margin-top:0">🛒 支出分类</div>
    ${catBlock(data.catExp,'expense')}
    <div class="chart-sec">💰 收入分类</div>
    ${catBlock(data.catInc,'income')}`;
}
function renderMonth(){
  let html='<div class="calendar">';
  ['日','一','二','三','四','五','六'].forEach(d=>html+=`<div class="dow">${d}</div>`);
  const first=new Date(view.getFullYear(),view.getMonth(),1);
  const daysInMonth=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  const todayStr=ymd(new Date());
  for(let i=0;i<first.getDay();i++) html+='<div class="day empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const key=ymd(new Date(view.getFullYear(),view.getMonth(),d));
    const list=entries[key]||[];
    let inc=0,exp=0;
    list.forEach(e=> e.type==='income'? inc+=entryAmount(e): exp+=entryAmount(e));
    const net=inc-exp;
    const show=net? (net>0?`<div class="tag"><span class="in">+${tagNum(net)}</span></div>`
                         :`<div class="tag"><span class="out">-${tagNum(-net)}</span></div>`):'';
    html+=`<div class="day${key===todayStr?' today':''}${key===selectedDay?' sel':''}" onclick="openDay('${key}')">
      <div class="dnum">${d}</div>${show}${list.length?'<div class="dot"></div>':''}
    </div>`;
  }
  return html+'</div>';
}
function renderYear(){
  let html='<div class="mgrid">';
  for(let m=0;m<12;m++){
    const data=collect(`${view.getFullYear()}-${String(m+1).padStart(2,'0')}`);
    const has=data.inc||data.exp;
    html+=`<div class="mcell" onclick="jumpMonth(${m})">
      <div class="m">${m+1}月</div>
      ${has?`<div class="mi">收 ${tagNum(data.inc)}</div><div class="mo">支 ${tagNum(data.exp)}</div>`
           :'<div class="none">无记录</div>'}
    </div>`;
  }
  return html+'</div>';
}
function renderAll(){
  const data=collect('');
  return `<div class="totals">
    <div class="t"><div class="l">累计总收入</div><div class="v" style="color:var(--income)">${fmt(data.inc)}</div></div>
    <div class="t"><div class="l">累计总支出</div><div class="v" style="color:var(--expense)">${fmt(data.exp)}</div></div>
    <div class="t"><div class="l">累计总结余</div><div class="v" style="color:var(--primary)">${fmt(data.inc-data.exp)}</div></div>
  </div>
  ${data.days?'':'<div class="empty-tip" style="text-align:center;padding:20px 0">还没有任何记账记录，点右下角「＋」开始记第一笔吧</div>'}`;
}
function catBlock(map,type){
  const arr=Object.entries(map).sort((a,b)=>b[1]-a[1]);
  if(!arr.length) return '<div class="empty-tip">暂无数据</div>';
  const max=arr[0][1]||1;
  return arr.map(([c,v])=>`
    <div class="catrow">
      <div class="top"><span>${c}</span><b style="color:var(--${type})">${fmt(v)}</b></div>
      <div class="bar"><i class="${type}" style="width:${(v/max*100).toFixed(1)}%"></i></div>
    </div>`).join('');
}

function syncViewSeg(){

function openDay(key){
  selectedDay=key;
  render();

}
function hideDayPanel(){
  selectedDay=null;

}
function renderDayPanel(){
  const panel=$('dayPanel');
  if(!selectedDay || curPeriod!=='month'){ panel.style.display='none'; return; }
  const [y,m,d]=selectedDay.split('-');
  const list=entries[selectedDay]||[];
  let inc=0,exp=0;
  list.forEach(e=> e.type==='income'? inc+=entryAmount(e): exp+=entryAmount(e));
  let html=`<div class="phead">
      <b>${+m}月${+d}日</b>
      <span class="psum">收 <span style="color:var(--income)">${fmt(inc)}</span> · 支 <span style="color:var(--expense)">${fmt(exp)}</span></span>
      <span><button class="icon-btn" style="width:30px;height:30px;font-size:14px" onclick="openForm('${selectedDay}')">＋</button>
      <button class="icon-btn" style="width:30px;height:30px;font-size:14px" onclick="hideDayPanel();render()">✕</button></span>
    </div>`;
  if(!list.length) html+='<div class="empty-tip">当日暂无记录，点右上角「＋」记一笔</div>';
  list.forEach((e,i)=>{
    html+=`<div class="rec">
      <span style="flex:1">
        <span class="top"><span>${e.type==='income'?'💰':'🛒'} <b>${e.cat||'其他'}</b>${e.note?' · '+e.note:''}</span>
        <b style="color:${e.type==='income'?'var(--income)':'var(--expense)'}">${e.type==='income'?'+':'-'}${entryAmount(e).toFixed(2)}</b></span>
        <div class="meta">${modeDesc(e)}${e.account?' · '+e.account:''}${e.time?' · '+e.time:''}</div>
      </span>
      <span class="ops">
        <button onclick="editEntry('${selectedDay}',${i})">✏️</button>
        <button onclick="delEntry('${selectedDay}',${i})">🗑️</button>
      </span>
    </div>`;
  });
  panel.innerHTML=html;
  panel.style.display='';
}
function delEntry(date,idx){
  if(!confirm('确定删除这条记录吗？')) return;
  entries[date].splice(idx,1);
  if(!entries[date].length) delete entries[date];
  save(); render(); renderDayPanel();
}

function updateFormUI(){

$('etypeSeg').addEventListener('click',e=>{
  if(!e.target.dataset.v)return;
  formType=e.target.dataset.v;

// ===== 算式输入 =====
function calcExpr(str){
  const s=String(str==null?'':str).trim();
  if(!s) return NaN;
  if(!/^[0-9+\-*/().\s]+$/.test(s)) return NaN;
  try{
    const v=Function('"use strict";return ('+s+')')();
    return (typeof v==='number'&&isFinite(v))?v:NaN;
  }catch(e){ return NaN; }
}
function numFrom(input){
  const v=calcExpr(input.value);
  return isNaN(v)?(parseFloat(input.value)||0):v;
}
function bindCalc(inputId, prevId){
  const inp=$(inputId), prev=$(prevId);
  inp.addEventListener('input',()=>{
    const s=inp.value.trim();
    if(!/[+\-*/()]/.test(s)){ prev.textContent=''; return; }
    const v=calcExpr(s);
    if(isNaN(v)){ prev.textContent='⚠ 算式无法计算'; prev.style.color='var(--expense)'; }
    else { prev.textContent='= '+(+v.toFixed(6)); prev.style.color='var(--primary)'; }
  });
}
bindCalc('ehoursInput','ehoursPrev');
bindCalc('edaysInput','edaysPrev');
bindCalc('eamountInput','eamountPrev');

function saveForm(){
  const date=$('edate').value;
  if(!date){ alert('请选择日期'); return; }
  const e={type:formType,mode:formType==='income'?formMode:'fixed',
           cat:formCat,account:$('eaccount').value,
           time:editing? (entries[editing.date][editing.idx].time||new Date().toTimeString().slice(0,5))
                       : new Date().toTimeString().slice(0,5),
           note:$('enote').value.trim()};
  let amt=0;
  if(e.type==='income'&&e.mode==='hours'){
    e.hours=numFrom($('ehoursInput'));
    e.rate=settings.hourly||0; amt=e.hours*e.rate;
  }else if(e.type==='income'&&e.mode==='days'){
    e.days=numFrom($('edaysInput'));
    e.rate=settings.daily||0; amt=e.days*e.rate;
  }else{
    amt=numFrom($('eamountInput')); e.amount=amt;
  }
  if(!(amt>0)){ alert('金额需要大于 0。按小时/按天会根据 ⚙️ 薪资设置自动计算。'); return; }
  if(editing){
    entries[editing.date].splice(editing.idx,1);
    if(!entries[editing.date].length) delete entries[editing.date];
  }
  (entries[date]=entries[date]||[]).push(e);
  save();
  entryDialog.close();
  selectedDay=date;
  render(); renderDayPanel();
}

/* ===== 图表分析 ===== */
function openStats(type){
  statsType=type;
  $('statsTypeSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===statsType));
  renderStats();
  statsDialog.showModal();

$('statsTypeSeg').addEventListener('click',e=>{
  if(!e.target.dataset.v)return;
  statsType=e.target.dataset.v;
  $('statsTypeSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===statsType));
  renderStats();

function trendData(type){
  if(curPeriod==='month'){
    const pre=ymd(view).slice(0,7);
    const dim=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
    const values=Array(dim).fill(0);
    Object.keys(entries).forEach(k=>{
      if(k.startsWith(pre)) entries[k].forEach(e=>{ if(e.type===type) values[+k.slice(8,10)-1]+=entryAmount(e); });
    });
    return {labels:Array.from({length:dim},(_,i)=>String(i+1)),values,unit:'日'};
  }
  if(curPeriod==='year'){
    const values=Array(12).fill(0);
    Object.keys(entries).forEach(k=>{
      if(k.startsWith(view.getFullYear()+'-')){
        const m=+k.slice(5,7)-1;
        entries[k].forEach(e=>{ if(e.type===type) values[m]+=entryAmount(e); });
      }
    });
    return {labels:Array.from({length:12},(_,i)=>(i+1)+'月'),values,unit:'月'};
  }
  const years={};
  Object.keys(entries).forEach(k=>{
    if(!entries[k].length) return;
    const y=k.slice(0,4);
    years[y]=years[y]||0;
    entries[k].forEach(e=>{ if(e.type===type) years[y]+=entryAmount(e); });
  });
  const keys=Object.keys(years).sort();
  return {labels:keys.map(y=>y+'年'),values:keys.map(y=>years[y]),unit:'年'};
}
function renderStats(){
  const data=collect(periodPrefix());
  const name=periodName();
  const typeText=statsType==='income'?'收入':'支出';
  $('statsTitle').textContent=`📈 ${name} · ${typeText}分析`;
  const trend=trendData(statsType);
  $('trendTitle').textContent=`📈 按${trend.unit}趋势`;
  const color=statsType==='income'?'#1a9e5c':'#e0554d';
  drawLine($('lineCv'),trend.labels,trend.values,color);
  // 饼图数据：分类占比
  const map=statsType==='income'?data.catInc:data.catExp;
  const items=Object.entries(map).sort((a,b)=>b[1]-a[1])
    .map(([c,v],i)=>({label:c,value:v,color:PALETTE[i%PALETTE.length]}));
  drawPie($('pieCv'),items);
  const total=items.reduce((s,i)=>s+i.value,0);
  $('pieLegend').innerHTML= items.length? items.map(it=>`
    <div class="lg-row"><i style="background:${it.color}"></i><span>${it.label}</span>
    <b style="color:var(--${statsType})">${fmt(it.value)}</b>
    <span style="color:var(--muted);flex:none">${(it.value/total*100).toFixed(1)}%</span></div>`).join('')
    : '<div class="empty-tip">暂无数据</div>';
}
function drawLine(cv,labels,values,color){
  const ctx=cv.getContext('2d'), dpr=devicePixelRatio||1;
  const w=cv.clientWidth||300, h=cv.clientHeight||170;
  cv.width=w*dpr; cv.height=h*dpr; ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const padL=40,padB=18,padT=10,padR=8, iw=w-padL-padR, ih=h-padT-padB;
  const max=Math.max(...values,0.0001);
  ctx.strokeStyle='#eef1f6'; ctx.fillStyle='#8a92a6'; ctx.font='10px sans-serif';
  for(let i=0;i<=3;i++){
    const y=padT+ih-ih*i/3;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
    ctx.textAlign='right';
    ctx.fillText(max*i/3>=1000?Math.round(max*i/3/1000)+'k':+(max*i/3).toFixed(1), padL-4, y+3);
  }
  if(!values.some(v=>v>0)){
    ctx.fillStyle='#8a92a6'; ctx.textAlign='center'; ctx.font='12px sans-serif';
    ctx.fillText('暂无数据',w/2,h/2); return;
  }
  ctx.textAlign='center';
  const step=Math.max(1,Math.ceil(labels.length/Math.floor(iw/26)));
  labels.forEach((lb,i)=>{
    if(i%step===0||i===labels.length-1)
      ctx.fillText(lb, padL+iw*i/(labels.length-1||1), h-5);
  });
  ctx.strokeStyle=color; ctx.lineWidth=2; ctx.beginPath();
  values.forEach((v,i)=>{
    const x=padL+iw*i/(values.length-1||1), y=padT+ih-ih*(v/max);
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  });
  ctx.stroke();
  ctx.fillStyle=color;
  values.forEach((v,i)=>{
    const x=padL+iw*i/(values.length-1||1), y=padT+ih-ih*(v/max);
    ctx.beginPath(); ctx.arc(x,y,2.5,0,Math.PI*2); ctx.fill();
  });
}
function drawPie(cv,items){
  const ctx=cv.getContext('2d'), dpr=devicePixelRatio||1;
  const w=cv.clientWidth||300, h=cv.clientHeight||170;
  cv.width=w*dpr; cv.height=h*dpr; ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const total=items.reduce((s,i)=>s+i.value,0);
  if(!total){
    ctx.fillStyle='#8a92a6'; ctx.font='12px sans-serif'; ctx.textAlign='center';
    ctx.fillText('暂无数据',w/2,h/2); return;
  }
  const cx=w/2, cy=h/2, r=Math.min(w,h)/2-6;
  let a0=-Math.PI/2;
  items.forEach(it=>{
    const a1=a0+it.value/total*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a0,a1); ctx.closePath();
    ctx.fillStyle=it.color; ctx.fill();
    a0=a1;
  });
  ctx.beginPath(); ctx.arc(cx,cy,r*0.55,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  ctx.fillStyle='#2b3245'; ctx.font='bold 13px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const t=total>=10000? +( (total/10000).toFixed(2) )+'w' : +( total.toFixed(2) );
  ctx.fillText('¥'+t,cx,cy);
}

// ===== 数据文件自动保存（File System Access API，Chrome/Edge）=====
let dataFileHandle=null, autoSaveTimer=null;
function idb(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open('calFin',1);
    req.onupgradeneeded=()=>req.result.createObjectStore('kv');
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  });
}
async function idbSet(v){ const db=await idb(); await new Promise((res,rej)=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,'dataFile'); t.oncomplete=res; t.onerror=()=>rej(t.error); }); db.close(); }
async function idbGet(){ const db=await idb(); const r=await new Promise((res,rej)=>{ const t=db.transaction('kv','readonly'); const q=t.objectStore('kv').get('dataFile'); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); db.close(); return r; }
function allData(){ return {entries,settings,exportedAt:new Date().toISOString()}; }
async function pickDataFile(){
  if(!window.showSaveFilePicker){ alert('当前浏览器不支持自选保存位置（需要 Chrome/Edge 桌面版，并在 https 或 localhost 下打开）。'); return; }
  try{
    const h=await showSaveFilePicker({
      suggestedName:`记账数据-${ymd(new Date())}.json`,
      types:[{description:'JSON 数据文件',accept:{'application/json':['.json']}}]
    });
    dataFileHandle=h;
    await idbSet(h);
    await writeDataFile();
    alert('已设置自动保存位置：\n'+h.name+'\n\n以后每次记账都会自动写入该文件，打开应用时也会自动读取。');
  }catch(e){}
}
async function writeDataFile(){
  if(!dataFileHandle) return;
  try{
    const w=await dataFileHandle.createWritable();
    await w.write(JSON.stringify(allData(),null,2));
    await w.close();
  }catch(e){}
}
function autoSaveFile(){
  clearTimeout(autoSaveTimer);
  autoSaveTimer=setTimeout(writeDataFile,500);
}
async function loadDataFile(){
  if(!dataFileHandle) return;
  try{
    if((await dataFileHandle.queryPermission({mode:'readwrite'}))!=='granted') return;
    const f=await dataFileHandle.getFile();
    const d=JSON.parse(await f.text());
    if(d.entries && JSON.stringify(d.entries)!==JSON.stringify(entries)){
      if(confirm('检测到数据文件内容与本机不同，是否用文件内容覆盖本机？\n（“取消”则保留本机数据并把本机数据写回文件）')){
        entries=d.entries; settings=d.settings||settings;
        localStorage.setItem(LS_DATA,JSON.stringify(entries));
        localStorage.setItem(LS_SETTINGS,JSON.stringify(settings));
        render();
      }
    }
  }catch(e){}
}
(async()=>{
  try{
    dataFileHandle=await idbGet();
    if(dataFileHandle){
      const p=await dataFileHandle.queryPermission({mode:'readwrite'});
      if(p==='granted') loadDataFile();
      else{
        const b=document.createElement('button');
        b.className='btn'; b.style.cssText='position:fixed;left:12px;right:80px;bottom:calc(18px + env(safe-area-inset-bottom, 0px));z-index:49;max-width:540px;margin:0 auto;display:block';
        b.textContent='📂 重新连接数据文件（'+dataFileHandle.name+'）';
        b.onclick=async()=>{
          const p2=await dataFileHandle.requestPermission({mode:'readwrite'});
          b.remove();
          if(p2==='granted'){ await loadDataFile(); writeDataFile(); }
        };
        document.body.appendChild(b);
      }
    }
  }catch(e){}
})();

function backup(){
  const data=JSON.stringify(allData(),null,2);
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`记账备份-${ymd(new Date())}.json`;
  a.click(); URL.revokeObjectURL(a.href);
}
